# =============================================================================
# MkDocs configuration for the JPPDOS App Developer Guide.
#
# Content is the existing docs/ tree, rendered IN PLACE — this file adds only
# site chrome (nav, theme, search). Do not fork or copy doc content here; the
# Markdown files under docs/ remain the single source of truth (see the
# DOCUMENTATION MAINTENANCE rule in AGENTS.md).
#
# Build / preview with the Dockerized toolchain (no host install needed):
#     docker build -f tools/docs/Dockerfile -t jppd-docs .
#     docker run --rm -p 8000:8000 -v "$PWD:/project" jppd-docs        # live preview
#     docker run --rm -v "$PWD:/project" jppd-docs build               # → ./site/
# =============================================================================
site_name: JPPDOS App Developer Guide
# Where the built site is published (see .github/workflows/docs.yml, which
# syncs it to the sdk-docs/ prefix of the docs bucket). Page links are relative,
# so the site also works when served from anywhere else — but sitemap.xml is
# generated empty without this, and canonical URLs depend on it.
site_url: https://jppdevice.by.m4l3vi.ch/sdk-docs/
site_description: >-
  Write apps for the J++Device — sandbox model, permission system, manifest
  schema, and a complete App SDK reference.
docs_dir: docs

theme:
  name: shadcn

plugins:
  - search

# Firmware-internal design docs live under docs/ but are not part of the
# published app-developer site.
exclude_docs: |
  sdk-expansion.md

# Python-Markdown ships most of these OFF by default. `tables` and `fenced_code`
# are REQUIRED — without them every table and code block in the docs breaks.
#
# The theme only styles a specific subset; do not swap these for near-equivalents
# without checking shadcn/css/base.css first:
#   * `codehilite` (NOT pymdownx.highlight / pymdownx.superfences) — the theme's
#     code and tab rules are written against the `.codehilite` wrapper class.
#   * `pymdownx.blocks.tab` WITHOUT `alternate_style` — the theme styles the
#     legacy radio-input markup (`input[type=radio]:checked+label+div.tabbed-content`)
#     and ships no JS for the alternate button markup, which would render as an
#     unstyled pile of stacked panes.
#   * `admonition` types with real styling: note (the base box), info, success,
#     warning, danger. Anything else (tip, example, quote…) silently falls back
#     to the plain note box.
markdown_extensions:
  - tables
  - fenced_code
  - codehilite
  - admonition
  - footnotes
  # attr_list backs the `{ #anchor }` overrides that keep short, stable anchors
  # on headings whose text carries a "(C only)" suffix.
  - attr_list
  - md_in_html
  # C / MicroPython signature pairs throughout the SDK reference.
  - pymdownx.blocks.tab
  - toc:
      permalink: true
      # The docs' hand-written #anchors were authored for GitHub's slug
      # algorithm; use a GitHub-compatible slugify so intra-page links resolve.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Overview: index.md
  - Guides:
      - MicroPython: micropython/getting-started.md
      - Native C: native/getting-started.md
      - Code modules: native/modules.md
  - Reference:
      - Manifest: manifest.md
      - SDK reference:
          - Index: sdk-reference.md
          - Types and constants: sdk/types.md
          - App control and input: sdk/app-control.md
          - Canvas and UI helpers: sdk/display.md
          - Buzzer, LED, device status: sdk/hardware.md
          - Storage and IPC: sdk/storage.md
          - Network: sdk/network.md
          - BLE and ESP-NOW: sdk/wireless.md
          - Crypto primitives: sdk/crypto.md
          - Background and modules: sdk/background.md
          - Resource limits: sdk/limits.md
      - SDK changelog: sdk-changelog.md
      - Serial protocol: serial-protocol.md
