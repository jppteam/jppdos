name: tests

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip -r requirements-test.txt

      - name: Run host pytest suite
        run: python3 -m pytest tests -v --tb=short
