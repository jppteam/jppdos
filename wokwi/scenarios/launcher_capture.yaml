name: "JPPDOS launcher capture"
version: 1
author: "jppdos"
steps:
  - wait-serial: "APPS_DISCOVERED"
  - wait-serial: "SYSTEM_READY"
  - wait-serial: "LAUNCHER_READY"
  - set-control:
      part-id: btn-ok
      control: pressed
      value: 1
  - delay: "100ms"
  - set-control:
      part-id: btn-ok
      control: pressed
      value: 0
  - wait-serial: "APP_OPEN|app_id=settings"
  - delay: "1000ms"
